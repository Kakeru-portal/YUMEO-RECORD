<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YUMEO-RECORD 曲登録ツール</title>
</head>
<body>
<h1>YUMEO-RECORD 曲登録ツール</h1>
<h2>歌枠情報</h2>
<label>
   動画ID
<input type="text" id="videoId" placeholder="例：ssh61KTPksk">
</label>
<br><br>
<label>
   配信日
<input type="date" id="date">
</label>
<br><br>
<label>
   歌唱者
<input type="text" id="singer" value="夢追翔">
</label>
<h2>曲情報</h2>
<div id="songInputs">
<div class="song-input">
<h3>曲 1</h3>
<label>
       曲名
<input type="text" class="title">
</label>
<br><br>
<label>
       原曲アーティスト
<input type="text" class="artist">
</label>
<br><br>
<label>
       開始時間
<input type="text" class="start" placeholder="例：57:02">
</label>
<br><br>
<label>
       終了時間
<input type="text" class="end" placeholder="例：1:03:09">
</label>
<br><br>
<label>
       種類
<select class="type">
<option value="cover">カバー</option>
<option value="original">オリジナル</option>
</select>
</label>
<br><br>
<label>
       歌唱人数
<select class="count">
<option value="1">ソロ</option>
<option value="2">2人</option>
<option value="3">3人</option>
<option value="4">4人</option>
<option value="5">5人以上</option>
</select>
</label>
<br><br>
<label>
       ユニット
<input type="text" class="unit" placeholder="例：VACHSS">
</label>
</div>
</div>
<br>
<button type="button" id="addSongButton">
   ＋ 曲を追加
</button>
<button type="button" id="generateButton">
   データを生成
</button>
<h2>生成されたデータ</h2>
<textarea id="output" rows="20" cols="80" readonly></textarea>
   <script>
let songNumber = 1;
const addSongButton = document.getElementById('addSongButton');
const songInputs = document.getElementById('songInputs');

// =========================
// 時間を秒数に変換
// =========================
function parseTime(time) {
 if (typeof time === 'number') {
   return time;
 }
 if (!time) {
   return 0;
 }
 const parts = String(time)
   .trim()
   .split(':')
   .map(Number);
 if (parts.some(Number.isNaN)) {
   return 0;
 }
 if (parts.length === 1) {
   return parts[0];
 }
 if (parts.length === 2) {
   // 分:秒
   return parts[0] * 60 + parts[1];
 }
 if (parts.length === 3) {
   // 時:分:秒
   return parts[0] * 3600 + parts[1] * 60 + parts[2];
 }
 return 0;
}

// =========================
// 曲入力欄を追加
// =========================
addSongButton.addEventListener('click', () => {
 songNumber++;
 const songInput = document.createElement('div');
 songInput.className = 'song-input';
 songInput.innerHTML = `
<hr>
<h3>曲 ${songNumber}</h3>
<label>
     曲名
<input type="text" class="title">
</label>
<br><br>
<label>
     原曲アーティスト
<input type="text" class="artist">
</label>
<br><br>
<label>
     開始時間
<input
       type="text"
       class="start"
       placeholder="例：57:02"
>
</label>
<br><br>
<label>
     終了時間
<input
       type="text"
       class="end"
       placeholder="例：1:03:09"
>
</label>
<br><br>
<label>
     種類
<select class="type">
<option value="cover">カバー</option>
<option value="original">オリジナル</option>
</select>
</label>
<br><br>
<label>
     歌唱人数
<select class="count">
<option value="1">ソロ</option>
<option value="2">2人</option>
<option value="3">3人</option>
<option value="4">4人</option>
<option value="5">5人以上</option>
</select>
</label>
<br><br>
<label>
     ユニット
<input
       type="text"
       class="unit"
       placeholder="例：VACHSS"
>
</label>
 `;
 songInputs.appendChild(songInput);
});
</script>
</body>
</html>
