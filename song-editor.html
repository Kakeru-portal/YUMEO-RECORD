<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YUMEO-RECORD 曲登録ツール</title>
</head>
<body>
<h1>YUMEO-RECORD 曲登録ツール</h1>
<h2>歌枠情報</h2>
<label>
   動画ID
<input type="text" id="videoId" placeholder="例：ssh61KTPksk">
</label>
<br><br>
<label>
   配信日
<input type="date" id="date">
</label>
<br><br>
<label>
   歌唱者
<input type="text" id="singer" value="夢追翔">
</label>
<h2>曲情報</h2>
<div id="songInputs">
<div class="song-input">
<h3>曲 1</h3>
<label>
       曲名
<input type="text" class="title">
</label>
<br><br>
<label>
       原曲アーティスト
<input type="text" class="artist">
</label>
<br><br>
<label>
       開始時間
<input type="text" class="start" placeholder="例：57:02">
</label>
<br><br>
<label>
       終了時間
<input type="text" class="end" placeholder="例：1:03:09">
</label>
<br><br>
<label>
       種類
<select class="type">
<option value="cover">カバー</option>
<option value="original">オリジナル</option>
</select>
</label>
<br><br>
<label>
       歌唱人数
<select class="count">
<option value="1">ソロ</option>
<option value="2">2人</option>
<option value="3">3人</option>
<option value="4">4人</option>
<option value="5">5人以上</option>
</select>
</label>
<br><br>
<label>
       ユニット
<input type="text" class="unit" placeholder="例：VACHSS">
</label>
</div>
</div>
<br>
<button type="button" id="addSongButton">
   ＋ 曲を追加
</button>
<button type="button" id="generateButton">
   データを生成
</button>
<h2>生成されたデータ</h2>
<textarea id="output" rows="20" cols="80" readonly></textarea>
   <script>
let songNumber = 1;
const addSongButton = document.getElementById('addSongButton');
const songInputs = document.getElementById('songInputs');
const generateButton = document.getElementById('generateButton');
const output = document.getElementById('output');

// =========================
// 時間を秒数に変換
// =========================
function parseTime(time) {
 if (typeof time === 'number') {
   return time;
 }
 if (!time) {
   return 0;
 }
 const parts = String(time)
   .trim()
   .split(':')
   .map(Number);
 if (parts.some(Number.isNaN)) {
   return 0;
 }
 if (parts.length === 1) {
   return parts[0];
 }
 if (parts.length === 2) {
   // 分:秒
   return parts[0] * 60 + parts[1];
 }
 if (parts.length === 3) {
   // 時:分:秒
   return parts[0] * 3600 + parts[1] * 60 + parts[2];
 }
 return 0;
}

// =========================
// 曲入力欄を追加
// =========================
addSongButton.addEventListener('click', () => {
 songNumber++;
 const songInput = document.createElement('div');
 songInput.className = 'song-input';
 songInput.innerHTML = `
<hr>
<h3>曲 ${songNumber}</h3>
<label>
     曲名
<input type="text" class="title">
</label>
<br><br>
<label>
     原曲アーティスト
<input type="text" class="artist">
</label>
<br><br>
<label>
     開始時間
<input
       type="text"
       class="start"
       placeholder="例：57:02"
>
</label>
<br><br>
<label>
     終了時間
<input
       type="text"
       class="end"
       placeholder="例：1:03:09"
>
</label>
<br><br>
<label>
     種類
<select class="type">
<option value="cover">カバー</option>
<option value="original">オリジナル</option>
</select>
</label>
<br><br>
<label>
     歌唱人数
<select class="count">
<option value="1">ソロ</option>
<option value="2">2人</option>
<option value="3">3人</option>
<option value="4">4人</option>
<option value="5">5人以上</option>
</select>
</label>
<br><br>
<label>
     ユニット
<input
       type="text"
       class="unit"
       placeholder="例：VACHSS"
>
</label>
 `;
 songInputs.appendChild(songInput);
});

// =========================
// データ生成
// =========================
generateButton.addEventListener('click', () => {
 const date = document.getElementById('songDate').value;
 const video = document.getElementById('videoId').value.trim();
 const singer = document.getElementById('singer').value.trim();
 const songs = document.querySelectorAll('.song-input');
 const result = [];
 songs.forEach(song => {
   const title =
     song.querySelector('.title')?.value.trim() || '';
   const artist =
     song.querySelector('.artist')?.value.trim() || '';
   const start =
     song.querySelector('.start')?.value.trim() || '';
   const end =
     song.querySelector('.end')?.value.trim() || '';
   const type =
     song.querySelector('.type')?.value || 'cover';
   const count =
     song.querySelector('.count')?.value || '1';
   const unit =
     song.querySelector('.unit')?.value.trim() || '';
   // 曲名が空欄ならスキップ
   if (!title) {
     return;
   }
   let songData = {
     title: title,
     count: count,
     type: type,
     date: date,
     unit: unit,
     artist: artist,
     singer: singer,
     video: video
   };
   // 開始時間が入力されている場合
   if (start !== '') {
     songData.start = parseTime(start);
   }
   // 終了時間が入力されている場合
   if (end !== '') {
     songData.end = parseTime(end);
   }
   result.push(songData);
 });

 // =========================
 // JavaScript形式に変換
 // =========================
 const formatted = result.map(song => {
   const lines = [
     `  {`,
     `    title: ${JSON.stringify(song.title)},`,
     `    count: ${JSON.stringify(song.count)},`,
     `    type: ${JSON.stringify(song.type)},`,
     `    date: ${JSON.stringify(song.date)},`,
     `    unit: ${JSON.stringify(song.unit)},`,
     `    artist: ${JSON.stringify(song.artist)},`,
     `    singer: ${JSON.stringify(song.singer)},`,
     `    video: ${JSON.stringify(song.video)}`
   ];
   if (song.start !== undefined) {
     lines[lines.length - 1] += ',';
     lines.push(`    start: ${song.start}`);
   }
   if (song.end !== undefined) {
     lines[lines.length - 1] += ',';
     lines.push(`    end: ${song.end}`);
   }
   lines.push(`  }`);
   return lines.join('\n');
 }).join(',\n');

 output.value = formatted;
});
</script>
</body>
</html>
