<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>夢追翔 歌唱曲データベース</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>夢追翔 歌唱曲データベース</h1>
<p>夢追翔さんの歌唱楽曲を記録・検索できる非公式ファンサイトです。</p>
</header>
<main>
<section>
<h2>歌唱曲一覧</h2>
<div class="search-area">
<div class="search-box">
<h3>曲を検索</h3>
<input
               type="text"
               id="songSearch"
               placeholder="曲名・アーティスト名・歌唱者名など"
>
<button type="button" id="searchButton">検索</button>
</div>
<div class="search-box">
<h3>歌唱人数</h3>
<label>
<input type="checkbox" name="memberCount" value="1">
               ソロ
</label>
<label>
<input type="checkbox" name="memberCount" value="2">
               2人
</label>
<label>
<input type="checkbox" name="memberCount" value="3">
               3人
</label>
<label>
<input type="checkbox" name="memberCount" value="4">
               4人
</label>
<label>
<input type="checkbox" name="memberCount" value="5">
               5人以上
</label>
</div>
<div class="search-box">
<h3>楽曲形態</h3>
<label>
<input type="checkbox" name="songType" value="original">
               オリジナル
</label>
<label>
<input type="checkbox" name="songType" value="cover">
               カバー
</label>
</div>
<div class="search-box">
<h3>ユニット</h3>
<label>
<input type="checkbox" name="unit" value="VACHSS">
               VACHSS
</label>
</div>
<div class="search-box">
<h3>年代</h3>
<label>
<input type="checkbox" name="year" value="2018">
               2018年
</label>
<label>
<input type="checkbox" name="year" value="2019">
               2019年
</label>
<label>
<input type="checkbox" name="year" value="2020">
               2020年
</label>
<label>
<input type="checkbox" name="year" value="2021">
               2021年
</label>
<label>
<input type="checkbox" name="year" value="2022">
               2022年
</label>
<label>
<input type="checkbox" name="year" value="2023">
               2023年
</label>
<label>
<input type="checkbox" name="year" value="2024">
               2024年
</label>
<label>
<input type="checkbox" name="year" value="2025">
               2025年
</label>
<label>
<input type="checkbox" name="year" value="2026">
               2026年
</label>
</div>
</div>
<h2>検索結果</h2>
<div id="songList">
<div
           class="song"
           data-count="1"
           data-type="original"
           data-date="2018-09-25"
           data-unit=""
>
<div class="song-card">
<h3>死にたくないから生きている</h3>
<p>原曲：夢追翔</p>
<p>歌唱：夢追翔</p>
<button
                   type="button"
                   class="play-button"
                   data-title="死にたくないから生きている"
                   data-video="XVVXrJQQuNs"
>
                   ▶ 再生
</button>
</div>
</div>
<div
           class="song"
           data-count="1"
           data-type="cover"
           data-date="2018-09-29"
           data-unit=""
>
<div class="song-card">
<h3>Lemon</h3>
<p>原曲：米津玄師</p>
<p>歌唱：夢追翔</p>
<button
                   type="button"
                   class="play-button"
                   data-title="Lemon"
                   data-video="RUJEeuX_Ac0"
>
                   ▶ 再生
</button>
</div>
</div>
</div>
</section>
  <div id="miniPlayer">
<div id="miniPlayerInfo">
<span id="miniPlayerTitle">曲を選択してください</span>
</div>
<div id="miniPlayerControls">
<button type="button" id="previousButton">
           ⏮
</button>
<button type="button" id="playPauseButton">
           ▶
</button>
<button type="button" id="nextButton">
           ⏭
</button>
<button type="button" id="shuffleButton">
           🔀
</button>
</div>
</div>
</main>
<footer>
<p>当サイトは非公式のファンサイトです。</p>
</footer>
  <script src="script.js"></script>
</body>
</html>
